<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tunnel Cluster Manager</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
    }

    .environments-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 20px;
    }

    .environment-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .environment-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .environment-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .environment-name {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .environment-details {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
    }

    .environment-details code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-stopped {
      background: #f0f0f0;
      color: #666;
    }

    .status-running {
      background: #d4edda;
      color: #155724;
      animation: pulse 2s infinite;
    }

    .status-starting {
      background: #fff3cd;
      color: #856404;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-start {
      background: #28a745;
      color: white;
    }

    .btn-start:hover:not(:disabled) {
      background: #218838;
      transform: translateY(-1px);
    }

    .btn-stop {
      background: #dc3545;
      color: white;
    }

    .btn-stop:hover:not(:disabled) {
      background: #c82333;
      transform: translateY(-1px);
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 18px;
    }

    .loading.active {
      display: block;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 13px;
      display: none;
    }

    .error.active {
      display: block;
    }

    .refresh-container {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .btn-refresh {
      background: white;
      color: #667eea;
      padding: 12px 24px;
      border: 2px solid white;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-refresh:hover {
      background: transparent;
      color: white;
      border-color: white;
    }

    .group-header {
      background: white;
      padding: 16px 24px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .group-header h2 {
      font-size: 20px;
      color: #667eea;
      margin: 0;
    }

    .environment-group {
      margin-bottom: 30px;
    }

    .auto-refresh-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 20px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #28a745;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .refresh-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Database Tunnel Manager</h1>
      <p class="subtitle">Manage your AWS RDS database tunnels across all environments</p>
    </header>

    <div class="refresh-container">
      <div class="refresh-header">
        <button class="btn-refresh" onclick="loadEnvironments()">Refresh Status</button>
        <div class="auto-refresh-toggle">
          <label class="toggle-switch">
            <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
            <span class="slider"></span>
          </label>
          <span style="color: white; font-size: 14px;">Auto-refresh</span>
        </div>
      </div>
    </div>

    <div class="loading active">Loading environments...</div>

    <div id="environments"></div>
  </div>

  <script>
    let autoRefreshInterval = null;

    function toggleAutoRefresh() {
      const checkbox = document.getElementById('autoRefresh');
      if (checkbox.checked) {
        autoRefreshInterval = setInterval(loadEnvironments, 31415);
      } else {
        if (autoRefreshInterval) {
          clearInterval(autoRefreshInterval);
          autoRefreshInterval = null;
        }
      }
    }

    async function loadEnvironments() {
      try {
        const response = await fetch('/api/environments');
        const environments = await response.json();

        const grouped = groupEnvironments(environments);
        displayEnvironments(grouped);

        document.querySelector('.loading').classList.remove('active');
      } catch (error) {
        console.error('Failed to load environments:', error);
        document.querySelector('.loading').textContent = 'Failed to load environments. Is the server running?';
      }
    }

    function groupEnvironments(environments) {
      const groups = {};

      environments.forEach(env => {
        const parts = env.name.split('-');
        let serviceName;

        if (parts[0] === 'author' && parts[1] === 'platform') {
          serviceName = 'Author Platform';
        } else if (parts[0] === 'author') {
          serviceName = 'Author ' + capitalize(parts[1]);
        } else if (parts[0] === 'elements') {
          serviceName = 'Elements ' + parts.slice(1, -1).map(capitalize).join(' ');
        } else if (parts[0] === 'platform') {
          serviceName = 'Platform ' + capitalize(parts[1]);
        } else if (parts[0] === 'tax') {
          serviceName = 'Tax Summaries Coordinator';
        } else {
          serviceName = parts.slice(0, -1).map(capitalize).join(' ');
        }

        if (!groups[serviceName]) {
          groups[serviceName] = [];
        }

        groups[serviceName].push(env);
      });

      return groups;
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function displayEnvironments(groups) {
      const container = document.getElementById('environments');
      container.innerHTML = '';

      const sortedGroups = Object.keys(groups).sort();

      sortedGroups.forEach(groupName => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'environment-group';

        const header = document.createElement('div');
        header.className = 'group-header';
        header.innerHTML = `<h2>${groupName}</h2>`;
        groupDiv.appendChild(header);

        const grid = document.createElement('div');
        grid.className = 'environments-grid';

        groups[groupName].forEach(env => {
          const card = createEnvironmentCard(env);
          grid.appendChild(card);
        });

        groupDiv.appendChild(grid);
        container.appendChild(groupDiv);
      });
    }

    function createEnvironmentCard(env) {
      const card = document.createElement('div');
      card.className = 'environment-card';
      card.id = `env-${env.name}`;

      const isRunning = env.status === 'running';
      const statusClass = isRunning ? 'status-running' : 'status-stopped';

      card.innerHTML = `
        <div class="environment-header">
          <div>
            <div class="environment-name">${env.name}</div>
            <div class="environment-details">Service: <code>${env.service}</code></div>
            <div class="environment-details">Local Port: <code>${env.localPort}</code></div>
            <div class="environment-details">Region: <code>${env.region}</code></div>
          </div>
          <div class="status-badge ${statusClass}" id="status-${env.name}">
            ${isRunning ? 'Running' : 'Stopped'}
          </div>
        </div>

        <div class="controls">
          <button class="btn-start" onclick="startTunnel('${env.name}')" ${isRunning ? 'disabled' : ''}>
            Start Tunnel
          </button>
          <button class="btn-stop" onclick="stopTunnel('${env.name}')" ${!isRunning ? 'disabled' : ''}>
            Stop Tunnel
          </button>
        </div>

        <div class="error" id="error-${env.name}"></div>
      `;

      return card;
    }

    async function startTunnel(environment) {
      const card = document.getElementById(`env-${environment}`);
      const statusBadge = document.getElementById(`status-${environment}`);
      const errorDiv = document.getElementById(`error-${environment}`);
      const buttons = card.querySelectorAll('button');

      buttons.forEach(btn => btn.disabled = true);
      statusBadge.className = 'status-badge status-starting';
      statusBadge.textContent = 'Starting...';
      errorDiv.classList.remove('active');

      try {
        const response = await fetch(`/api/tunnels/${environment}/start`, {
          method: 'POST'
        });

        const result = await response.json();

        if (response.ok) {
          setTimeout(() => loadEnvironments(), 1000);
        } else {
          throw new Error(result.error || 'Failed to start tunnel');
        }
      } catch (error) {
        console.error('Failed to start tunnel:', error);
        errorDiv.textContent = `Error: ${error.message}`;
        errorDiv.classList.add('active');
        statusBadge.className = 'status-badge status-stopped';
        statusBadge.textContent = 'Stopped';
        buttons[0].disabled = false;
      }
    }

    async function stopTunnel(environment) {
      const card = document.getElementById(`env-${environment}`);
      const statusBadge = document.getElementById(`status-${environment}`);
      const errorDiv = document.getElementById(`error-${environment}`);
      const buttons = card.querySelectorAll('button');

      buttons.forEach(btn => btn.disabled = true);
      statusBadge.className = 'status-badge status-starting';
      statusBadge.textContent = 'Stopping...';
      errorDiv.classList.remove('active');

      try {
        const response = await fetch(`/api/tunnels/${environment}/stop`, {
          method: 'POST'
        });

        const result = await response.json();

        if (response.ok) {
          setTimeout(() => loadEnvironments(), 500);
        } else {
          throw new Error(result.error || 'Failed to stop tunnel');
        }
      } catch (error) {
        console.error('Failed to stop tunnel:', error);
        errorDiv.textContent = `Error: ${error.message}`;
        errorDiv.classList.add('active');
        buttons[1].disabled = false;
      }
    }

    loadEnvironments();
  </script>
</body>
</html>
